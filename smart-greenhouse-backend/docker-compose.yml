services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  smart-greenhouse-backend:
    image: ${DOCKER_USERNAME}/smart-greenhouse-backend:latest
    container_name: smart-greenhouse-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT}:8081"
    depends_on:
      - mysql
    volumes:
      - /app/node_modules
